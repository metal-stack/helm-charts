apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
    {{- include "postgreslet.labels" . | nindent 4 }}
  name: {{ include "postgreslet.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "postgreslet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/sidecars: {{ include (print $.Template.BasePath "/configmap-sidecars.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        control-plane: controller-manager
{{- if .Values.addRandomLabel }}
        random-label-to-force-reload: {{ randAlphaNum 12 | quote }}
{{- end }}
        {{- include "postgreslet.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "postgreslet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: prepull-spilo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/manager", "--version"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 103
            seccompProfile:
              type: "RuntimeDefault"
        - name: prepull-fluentbit
          image: "{{ .Values.sidecars.fluentbit.imageRepository }}:{{ .Values.sidecars.fluentbit.imageTag }}"
          command: ["/fluent-bit/bin/fluent-bit", "--version"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
        - name: prepull-postgres-exporter
          image: "{{ .Values.sidecars.exporter.imageRepository }}:{{ .Values.sidecars.exporter.imageTag }}"
          command: ["sh", "-c", "'true'"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
        - name: prepull-operator
          image: "{{ .Values.postgreslet.operatorImageRepository}}:{{ .Values.postgreslet.operatorImageTag}}"
          command: ["sh", "-c", "'true'"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
        - name: prepull-walg-exporter
          image: "{{ .Values.sidecars.walGExporter.imageRepository }}:{{ .Values.sidecars.walGExporter.imageTag }}"
          command: ["sh", "-c", "'true'"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          envFrom:
            - configMapRef:
                name: {{ include "postgreslet.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/run/secrets/postgreslet
              name: controlplane-kubeconfig
              readOnly: true
{{- if .Values.postgreslet.enableFsGroupChangePolicyWebhook }}
{{- if .Values.postgreslet.tlsClusterIssuer }}
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-tls
              readOnly: true
{{- end }}
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: controlplane-kubeconfig
          secret:
            items:
              - key: controlplane-kubeconfig
                path: kube/config
            secretName: {{ include "postgreslet.fullname" . }}
{{- if .Values.postgreslet.enableFsGroupChangePolicyWebhook }}
{{- if .Values.postgreslet.tlsClusterIssuer }}
        - name: webhook-tls
          secret:
            defaultMode: 420
            secretName: {{ include "postgreslet.fullname" . }}-webhook-tls
{{- end }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
